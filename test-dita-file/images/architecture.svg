<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="arch-title arch-desc">
    <title id="arch-title">Acme Flow Engine 分层架构</title>
    <desc id="arch-desc">从上到下依次为采集、解析、渲染和发布四层。</desc>
    <rect x="0" y="0" width="640" height="360" rx="16" fill="#f7f9fc"/>
    <text x="24" y="26" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#30445c">Acme Flow Engine · 分层架构</text>

    <rect x="48" y="42" width="544" height="56" rx="10" fill="#e8f0ff" stroke="#3b6fd8" stroke-width="2"/>
    <text x="72" y="68" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#173a75">采集层</text>
    <text x="72" y="88" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#30445c">文件、API、消息队列与定时任务</text>

    <rect x="48" y="122" width="544" height="56" rx="10" fill="#eaf7ef" stroke="#2f8f57" stroke-width="2"/>
    <text x="72" y="148" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#174d2f">解析层</text>
    <text x="72" y="168" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#30445c">DITA 解析、键解析、内容引用展开</text>

    <rect x="48" y="202" width="544" height="56" rx="10" fill="#fff4e5" stroke="#c47b12" stroke-width="2"/>
    <text x="72" y="228" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#6b4308">渲染层</text>
    <text x="72" y="248" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#30445c">主题样式、图片、MathML 与交叉引用</text>

    <rect x="48" y="282" width="544" height="56" rx="10" fill="#f3ecff" stroke="#7d4fc4" stroke-width="2"/>
    <text x="72" y="308" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#45217d">发布层</text>
    <text x="72" y="328" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#30445c">站点、整书、PDF 与帮助中心</text>

    <path d="M320 98 L320 116" stroke="#6b7c93" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M320 178 L320 196" stroke="#6b7c93" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M320 258 L320 276" stroke="#6b7c93" stroke-width="3" marker-end="url(#arrow)"/>
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7c93"/>
        </marker>
    </defs>
</svg>
