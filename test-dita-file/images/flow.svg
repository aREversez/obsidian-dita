<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="560" height="220" viewBox="0 0 560 220" role="img" aria-labelledby="flow-title flow-desc">
    <title id="flow-title">从输入到输出的三步流程</title>
    <desc id="flow-desc">输入进入处理阶段，再进入输出阶段。</desc>
    <rect x="0" y="0" width="560" height="220" rx="16" fill="#fbfcfe"/>
    <text x="28" y="34" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#30445c">三步处理流程</text>

    <rect x="28" y="70" width="140" height="96" rx="12" fill="#e8f0ff" stroke="#3b6fd8" stroke-width="2"/>
    <text x="98" y="111" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#173a75">输入</text>
    <text x="98" y="136" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#30445c">DITA / Markdown</text>

    <rect x="210" y="70" width="140" height="96" rx="12" fill="#eaf7ef" stroke="#2f8f57" stroke-width="2"/>
    <text x="280" y="111" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#174d2f">处理</text>
    <text x="280" y="136" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#30445c">解析 / 复用 / 过滤</text>

    <rect x="392" y="70" width="140" height="96" rx="12" fill="#fff4e5" stroke="#c47b12" stroke-width="2"/>
    <text x="462" y="111" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#6b4308">输出</text>
    <text x="462" y="136" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#30445c">HTML / PDF / JSON</text>

    <path d="M172 118 L204 118" stroke="#6b7c93" stroke-width="3" marker-end="url(#flow-arrow)"/>
    <path d="M354 118 L386 118" stroke="#6b7c93" stroke-width="3" marker-end="url(#flow-arrow)"/>
    <defs>
        <marker id="flow-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7c93"/>
        </marker>
    </defs>
</svg>
