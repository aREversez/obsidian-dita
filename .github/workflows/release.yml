# Publish a release when a version tag is pushed.
#
#   npm version 0.2.0 -w obsidian-dita --no-git-tag-version
#   npm run release:prepare
#   git commit -am "chore: release 0.2.0" && git tag 0.2.0 && git push && git push origin 0.2.0
#
# The tag is the bare version, with no leading "v": Obsidian and BRAT install
# the release whose tag equals manifest.json's version.
#
# The job then builds, mirrors main.js/styles.css/manifest.json into the
# repository root of its own working tree, and attaches those three files to
# the release under flat names, so what ships is what this runner built. It
# writes no git objects: the committed root copies come from
# `npm run release:prepare`, and the CI workflow fails a branch whose copies
# drifted from the build.
#
# @dita-viewer/core is not released from here: it is published from the VS Code
# DITA Viewer repository (tag core-<version>), and this plugin pins a version.

name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Typecheck, all tests, the bundle, and the manifest checks.
      - run: npm run verify

      # verify cannot know the tag; this is what stops "0.2.1" shipping a 0.2.0 manifest.
      - name: Check the tag matches manifest.json
        run: node scripts/check-release.mjs "$GITHUB_REF_NAME"

      # Obsidian loads main.js, manifest.json and styles.css from the plugin
      # folder; the submission wants them tracked at the repository root. This
      # refreshes the working copy from the build on this runner, which is what
      # gets attached below, and leaves the tagged tree untouched.
      - name: Sync the built assets into the repository root
        run: npm run sync:root

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          gh release delete "$VERSION" --yes 2>/dev/null || true
          # No --target: the tag names the commit, and GitHub rejects a tag
          # passed as target_commitish.
          gh release create "$VERSION" \
            --title "$VERSION" --notes "$VERSION" \
            main.js manifest.json styles.css
